name: Build Twitch Harbor Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/twitch-harbor/**"
      - ".github/workflows/ci-twitch-harbor.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/twitch-harbor/**"
      - ".github/workflows/ci-twitch-harbor.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/keelfy/pickle-twitch-harbor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Twitch Harbor image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/twitch-harbor
          file: ./apps/twitch-harbor/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max