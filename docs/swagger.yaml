basePath: /v1
definitions:
  github_com_pickle_pw_monolith_db_sqlc.ContentCategory:
    enum:
    - games
    - movies
    - video
    - anime
    - series
    - custom
    type: string
    x-enum-varnames:
    - ContentCategoryGames
    - ContentCategoryMovies
    - ContentCategoryVideo
    - ContentCategoryAnime
    - ContentCategorySeries
    - ContentCategoryCustom
  github_com_pickle_pw_monolith_db_sqlc.GameNoteStatus:
    enum:
    - planned
    - playing
    - paused
    - dropped
    - finished
    - skipped
    type: string
    x-enum-varnames:
    - GameNoteStatusPlanned
    - GameNoteStatusPlaying
    - GameNoteStatusPaused
    - GameNoteStatusDropped
    - GameNoteStatusFinished
    - GameNoteStatusSkipped
  github_com_pickle_pw_monolith_db_sqlc.OrderStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusApproved
    - OrderStatusRejected
  github_com_pickle_pw_monolith_internal_types.BatchNoteReactionsRes:
    properties:
      noteId:
        type: string
      reactions:
        items:
          $ref: '#/definitions/github_com_pickle_pw_monolith_internal_types.NoteReactionRes'
        type: array
    type: object
  github_com_pickle_pw_monolith_internal_types.CollectionItemRes:
    properties:
      collectionId:
