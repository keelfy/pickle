#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - fail2ban
  - ufw
  - unattended-upgrades

users:
  - name: ${deploy_user}
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      bantime = 3600
      findtime = 600

  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Enable Docker service
  - systemctl enable docker
  - systemctl start docker

  # Configure UFW firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Enable automatic security updates
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades

  # Create app directory
  - mkdir -p /home/${deploy_user}/pickle
  - chown -R ${deploy_user}:${deploy_user} /home/${deploy_user}/pickle

  # Mount data volume (will be at /dev/sdb after Hetzner attaches it)
  - mkdir -p /mnt/data
  - |
    if [ -b /dev/sdb ]; then
      if ! blkid /dev/sdb | grep -q ext4; then
        mkfs.ext4 /dev/sdb
      fi
      mount /dev/sdb /mnt/data
      echo '/dev/sdb /mnt/data ext4 defaults 0 2' >> /etc/fstab
    fi
  - mkdir -p /mnt/data/postgres /mnt/data/redis /mnt/data/elasticsearch
  - chown -R ${deploy_user}:${deploy_user} /mnt/data

  # Disable root SSH login
  - sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd
